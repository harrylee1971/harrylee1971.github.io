<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harry Lee App</title>
  <meta name="description" content="Harry Lee 開發的實用 Android 應用程式。">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f5f7fa;
      color: #222;
      line-height: 1.6;
    }

    .container {
      width: min(900px, 90%);
      margin: 0 auto;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #dddddd;
      padding: 18px 0;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      padding: 60px 0;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
    }

    .app-list {
      margin-top: 24px;
    }

    .app-item {
      padding: 18px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .app-item:last-child {
      border-bottom: none;
    }

    .app-item h3 {
      margin: 0 0 8px;
    }

    footer {
      text-align: center;
      padding: 24px 0;
      color: #666666;
      font-size: 14px;
    }

    a {
      color: #1769aa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Harry Lee App</h1>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="card">
        <h2>歡迎來到我的應用程式網站</h2>
        <p>
          這裡提供我所開發的 Android 應用程式資訊。
        </p>

        <div class="app-list">
          <div class="app-item">
            <h3>買賣計算機</h3>
            <p>提供公斤、公克、台斤、兩、錢等常用重量單位換算。</p>
          </div>

          <div class="app-item">
            <h3>斤斤計較王</h3>
            <p>輸入單價與重量，即可快速計算商品總金額。</p>
          </div>
        </div>

        <p>
          聯絡信箱：
          <a href="mailto:your-email@example.com">your-email@example.com</a>
        </p>
      </section>
    </div>
  </main>

  <footer>
    © 2026 Harry Lee. All rights reserved.
  </footer>
</body>
</html>
